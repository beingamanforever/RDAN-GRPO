[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rdan-grpo"
version = "0.1.0"
description = "Rubric Decoupled Advantage Normalization GRPO for instruction following RL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets==3.1.0",
    "matplotlib>=3.8",
    "openai==2.20.0",
    "pyyaml>=6",
    "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.ruff]
line-length = 119
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
