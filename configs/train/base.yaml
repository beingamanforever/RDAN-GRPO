hydra:
  run:
    dir: .
  output_subdir: null

# GPU count for the actor and rollout engines. Override on the command line to scale,
# e.g. `--config-override num_gpus=4`. Reward workers are CPU/API only.
num_gpus: 2
exp_name: rdan
seed: 240520
global_template: qwen3_nothinking
logging_dir: ./output/${exp_name}/logs
output_dir: ./output/${exp_name}
rollout_dump_dir: ./output/${exp_name}/rollouts
checkpoint_config: {}
track_with: rdan_wandb
# group ties the method runs together so W&B overlays them on one comparison chart.
tracker_kwargs:
  project: rdan-grpo-qwen3-4b
  name: ${exp_name}
  group: qwen3-4b-instruct-2507
  tags: [qwen3-4b, instruction-following, hybrid-16k]

num_gpus_per_node: ${num_gpus}
max_steps: 500
save_steps: 20
logging_steps: 1
resume_from_checkpoint: false
rpc_timeout: 3600

rollout_batch_size: 64
prompt_length: 1280
response_length: 2048
num_return_sequences_in_group: 8
ppo_epochs: 1
adv_estimator: reinforce

pg_clip: 0.2
pg_clip_low: 0.2
pg_clip_high: 0.27
use_pg_clip_range: true
importance_sampling: token
dual_clip_loss: false
whiten_rewards: false
whiten_advantages: false

# RDAN carries no reference model and no KL term: the advantage already contains both the
# outcome and the process channel, and a KL anchor would dampen the process signal.
init_kl_coef: 0
enable_reference: false
add_token_level_kl: false
enable_old_logprobs_recompute: true
async_pipeline: false
async_generation_ratio: 0
generate_opt_level: 0
is_num_return_sequences_expand: false

pretrain: ${oc.env:RDAN_MODEL_SNAPSHOT}

# per_device_train_batch_size x gradient_accumulation_steps x world_size is the global batch,
# and rollout_batch_size x num_return_sequences_in_group must be a multiple of it. On 4 GPUs
# halve gradient_accumulation_steps to 16 to keep the same global batch of 256.
actor_train:
  worker_cls: rdan_grpo.workers.ResponseActorWorker
  model_args:
    model_name_or_path: ${oc.env:RDAN_MODEL_SNAPSHOT}
    attn_implementation: fa2
    disable_gradient_checkpointing: false
    dtype: bf16
  training_args:
    learning_rate: 1.0e-6
    weight_decay: 0
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 32
    warmup_steps: 20
    num_train_epochs: 50
  data_args:
    template: qwen3_nothinking
    file_name: [data/hybrid.jsonl]
    domain_interleave_probs:
      llm_judge: 1.0
    messages: messages
    interleave_probs: "1.0"
    preprocessing_num_workers: 16
  strategy_args:
    strategy_name: fsdp2_train
    strategy_config:
      transformer_impl: huggingface
  device_mapping: ${num_gpus}
  world_size: ${num_gpus}
  num_gpus_per_worker: 1
  infer_batch_size: 8

actor_infer:
  worker_cls: rdan_grpo.workers.ResponseVLLMInferWorker
  model_args:
    model_name_or_path: ${oc.env:RDAN_MODEL_SNAPSHOT}
    attn_implementation: sdpa
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    do_sample: true
    max_new_tokens: ${response_length}
    num_beams: 1
    num_return_sequences: ${num_return_sequences_in_group}
    temperature: 0.99
    top_k: 100
    top_p: 0.99
  strategy_args:
    strategy_name: vllm
    strategy_config:
      gpu_memory_utilization: 0.65
      block_size: 16
      max_model_len: 3328
      load_format: auto
      sleep_level: 1
  device_mapping: ${num_gpus}
  world_size: ${num_gpus}
  num_gpus_per_worker: 1
  max_concurrency: 32
  infer_batch_size: 4

rewards:
  llm_judge:
    worker_cls: rdan_grpo.reward_worker.RubricRewardWorker
    world_size: 8
    device_mapping: null
    max_concurrency: 1
    judge_model_type: api
    judge_model_name: qwen/qwen3.7-flash
    judge_api_url: https://openrouter.ai/api/v1
    tag_included: [llm_judge]
    model_args:
      model_name_or_path: ${oc.env:RDAN_MODEL_SNAPSHOT}
      disable_gradient_checkpointing: true
      dtype: bf16
    data_args:
      template: native
    strategy_args:
      strategy_name: hf_infer
    infer_batch_size: 8
