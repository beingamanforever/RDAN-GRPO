hydra:
  run:
    dir: .
  output_subdir: null

exp_name: qwen-rdan-scalar-pilot-s240520
seed: 240520
global_template: qwen3_nothinking
logging_dir: ./output/qwen-rdan-scalar-pilot-s240520/logs
output_dir: ./output/qwen-rdan-scalar-pilot-s240520
rollout_dump_dir: ./.local-rdan/rollouts/qwen-rdan-scalar-pilot-s240520
checkpoint_config:
  type: file_system
  output_dir: ./.local-rdan/checkpoints/qwen-rdan-scalar-pilot-s240520

track_with: wandb
tracker_kwargs:
  project: rdan-grpo-qwen3-4b
  name: qwen-rdan-scalar-pilot-s240520
  tags: [rdan-scalar, response-only, no-token, pilot-20-step, qwen3-4b, seed-240520]

num_gpus_per_node: 2
max_steps: 20
save_steps: 20
logging_steps: 1
eval_steps: 20
resume_from_checkpoint: false

rollout_batch_size: 64
prompt_length: 2048
response_length: 4096
num_return_sequences_in_group: 8
ppo_epochs: 1
adv_estimator: reinforce

pg_clip: 0.2
pg_clip_low: 0.2
pg_clip_high: 0.27
use_pg_clip_range: true
importance_sampling: token
dual_clip_loss: false
norm_mean_type: null
norm_std_type: null
whiten_rewards: false
whiten_advantages: false
max_len_mask: false
difficulty_mask: false
difficulty_low_threshold: -1
difficulty_high_threshold: 1
error_max_len_clip: false
difficulty_loss_weight: false
length_loss_weight: false

init_kl_coef: 0
enable_reference: false
add_token_level_kl: false
reward_union_type: all-or-nothing

pretrain: ${oc.env:RDAN_MODEL_SNAPSHOT}
actor_train:
  model_args:
    disable_gradient_checkpointing: false
    dtype: bf16
  training_args:
    learning_rate: 1.0e-6
    weight_decay: 0
    per_device_train_batch_size: 4
    gradient_accumulation_steps: 2
    warmup_steps: 20
    num_train_epochs: 50
  data_args:
    template: qwen3_nothinking
    file_name: [data/HIR_trainv1_rdan_scalar_certified.jsonl]
    domain_interleave_probs:
      llm_judge: 1.0
    dataset_dir: .
    messages: messages
    interleave_probs: "1.0"
    preprocessing_num_workers: 16
  strategy_args:
    strategy_name: megatron_train
    strategy_config:
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      expert_model_parallel_size: 1
      transformer_impl: local
      use_distributed_optimizer: true
      recompute_granularity: full
  device_mapping: list(range(0, 2))
  infer_batch_size: 4

actor_infer:
  model_args:
    disable_gradient_checkpointing: true
    dtype: bf16
  generating_args:
    max_new_tokens: ${response_length}
    top_p: 0.99
    top_k: 100
    num_beams: 1
    temperature: 0.99
    num_return_sequences: ${num_return_sequences_in_group}
  data_args:
    template: qwen3_nothinking
  strategy_args:
    strategy_name: vllm
    strategy_config:
      gpu_memory_utilization: 0.8
      block_size: 16
      max_model_len: 8000
      load_format: auto
  device_mapping: list(range(0, 2))
  infer_batch_size: 1

rewards:
  llm_judge:
    worker_cls: rdan_grpo.roll_reward.ScalarRubricRewardWorker
    world_size: 8
    max_concurrency: 1
    judge_model_type: api
    judge_model_name: openai/gpt-5.6-luna
    judge_api_url: https://openrouter.ai/api/v1
    tag_included: [llm_judge]
    model_args:
      model_name_or_path: ${oc.env:RDAN_MODEL_SNAPSHOT}
      disable_gradient_checkpointing: true
      dtype: bf16
    generating_args:
      max_new_tokens: 512
      top_p: 0.01
      top_k: 1
      num_beams: 1
      temperature: 0.01
      num_return_sequences: 1
    data_args:
      template: native
    strategy_args:
      strategy_name: hf_infer
    infer_batch_size: 8
